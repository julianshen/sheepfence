name: Developer documentation
on:
  push:
    branches: [main]
    paths: ['docs/developer/**', 'docs/site/**', 'scripts/build_docs.py', 'scripts/tests/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/developer/**', 'docs/site/**', 'scripts/build_docs.py', 'scripts/tests/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/site/requirements.txt
      - run: pip install -r docs/site/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --test scripts/tests/editor-model.test.mjs
      - run: python scripts/build_docs.py
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: .build/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
